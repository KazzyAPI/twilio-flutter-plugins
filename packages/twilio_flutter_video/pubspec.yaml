name: twilio_flutter_video
description: Typed Flutter wrapper for the Twilio Video SDK (scaffold).
version: 0.0.1
publish_to: none

environment:
  sdk: '>=3.2.6 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  twilio_flutter_core:
    path: ../twilio_flutter_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.twilioflutter.video
        pluginClass: TwilioFlutterVideoPlugin
      ios:
        pluginClass: TwilioFlutterVideoPlugin
