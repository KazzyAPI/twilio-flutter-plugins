name: twilio_flutter_conversations
description: Typed Flutter wrapper for the Twilio Conversations SDK on iOS and Android.
version: 0.0.1
repository: https://github.com/KazzyAPI/twilio-flutter-plugins
issue_tracker: https://github.com/KazzyAPI/twilio-flutter-plugins/issues

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0
  twilio_flutter_core: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^29.0.2

flutter:
  plugin:
    platforms:
      android:
        package: com.twilioflutter.conversations
        pluginClass: TwilioFlutterConversationsPlugin
      ios:
        pluginClass: TwilioFlutterConversationsPlugin
