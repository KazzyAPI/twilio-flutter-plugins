include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - lib/src/pigeon/**
    - build/**
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    prefer_initializing_formals: ignore

linter:
  rules:
    public_member_api_docs: false
    prefer_initializing_formals: false
